# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# Mouse
set -g mouse on

# Windows/panes start at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Big scrollback
set -g history-limit 20000

# No ESC delay (vim-friendly)
set -sg escape-time 0

# Focus events for vim autoread
set -g focus-events on

# Prefix stays Ctrl+B — change to Ctrl+A if preferred:
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Split with | and - (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status bar
set -g status-style "bg=colour235,fg=colour136"
set -g status-left-length 40
set -g status-left "#[fg=green]#S #[fg=yellow]w#I p#P "
set -g status-right "#[fg=cyan]%d %b %H:%M"
set -g status-interval 30

# Highlight active window
setw -g window-status-current-style "fg=colour166,bold"

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off
